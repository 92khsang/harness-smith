[project]
name = "harness-smith"
version = "0.1.0"
description = "Harness governance toolchain: discovers, classifies, and governs agent harness artifacts."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
harness-smith = "harness_smith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_smith"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "jsonschema>=4.23",
    "mypy>=1.14",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["harness_smith", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
